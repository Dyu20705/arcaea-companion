name: Sync PR 90 with main

on:
  push:
    branches:
      - fix/week-3-public-pages-scope
    paths:
      - .github/workflows/agent-sync-pr90-main.yml

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: fix/week-3-public-pages-scope
          fetch-depth: 0

      - name: Merge current main
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:fix/week-3-public-pages-scope
