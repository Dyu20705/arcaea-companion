</style><rect x="0" y="0" width="1440" height="78" rx="0" fill="#FFFFFF" stroke="#BCC6D6" stroke-width="1"/><polygon points="0,0 310,0 270,78 0,78" fill="#E9EEF7"/><text x="48" y="34" class="label" fill="#3D4FD7" font-weight="800">ARCAEA-VIEWER</text><text x="48" y="56" class="small" fill="#4C566A">UNOFFICIAL • SOURCE-AWARE WIKI</text><text x="430" y="48" class="body" fill="#3D4FD7" font-weight="700">Home</text><text x="510" y="48" class="body" fill="#151922" font-weight="600">Explore</text><text x="602" y="48" class="body" fill="#151922" font-weight="600">Wiki</text><text x="670" y="48" class="body" fill="#151922" font-weight="600">Information</text><rect x="1180" y="19" width="92" height="40" rx="6" fill="#FFFFFF" stroke="#7D889B" stroke-width="1"/><text x="1226.0" y="44.0" class="body" fill="#151922" font-weight="700" text-anchor="middle">Search</text><rect x="1284" y="19" width="108" height="40" rx="6" fill="#FFFFFF" stroke="#7D889B" stroke-width="1"/><text x="1338.0" y="44.0" class="body" fill="#151922" font-weight="700" text-anchor="middle">Settings</text><polygon points="1100,0 1440,0 1440,78 1160,78" fill="#3D4FD7" opacity=".07"/><rect x="80" y="118" width="206" height="26" rx="4" fill="#E9EEF7" stroke="#3D4FD7" stroke-width="1"/><text x="90" y="136" class="small" fill="#3D4FD7" font-weight="700">UNOFFICIAL FAN PROJECT</text><text x="80" y="180" class="h1">Find the fact. See the source.</text><text x="80" y="220" class="body" fill="#4C566A">A fast static catalog for discovering songs, packs, partners, and game topics.</text><text x="80" y="246" class="small" fill="#5C6470">Synthetic prototype data — not game content.</text><rect x="80" y="276" width="790" height="52" rx="8" fill="#FFFFFF" stroke="#7D889B" stroke-width="1"/><circle cx="104" cy="302" r="8" fill="none" stroke="#4C566A" stroke-width="2"/><line x1="110" y1="308" x2="116" y2="314" stroke="#4C566A" stroke-width="2"/><text x="128" y="308" class="body" fill="#4C566A">Search songs, packs, partners, and topics</text><rect x="766" y="283" width="96" height="38" rx="6" fill="#3D4FD7" stroke="#3D4FD7" stroke-width="1"/><text x="814.0" y="307.0" class="body" fill="#FFFFFF" font-weight="700" text-anchor="middle">Search</text><rect x="930" y="118" width="430" height="220" rx="12" fill="#FFFFFF" stroke="#BCC6D6" stroke-width="1"/><text x="962" y="154" class="label" fill="#4C566A">CATALOG STATUS</text><text x="962" y="194" class="h3">Snapshot 0.1.0-prototype</text><rect x="962" y="214" width="112" height="26" rx="4" fill="#E9EEF7" stroke="#246B47" stroke-width="1"/><text x="972" y="232" class="small" fill="#246B47" font-weight="700">REVIEWED</text><text x="1084" y="233" class="small" fill="#4C566A">Reviewed 25 Jul 2026</text><line x1="962" y1="260" x2="1328" y2="260" stroke="#BCC6D6" stroke-width="1"/><text x="962" y="288" class="body" fill="#8A4B00" font-weight="700">Current information may be stale.</text><text x="962" y="314" class="small" fill="#4C566A">Every dated item keeps its source and review date.</text><text x="80" y="390" class="h2">Reviewed highlights</text><text x="80" y="418" class="body" fill="#4C566A">Useful entry points that remain complete without official media.</text><rect x="80" y="448" width="376" height="210" rx="10" fill="#FFFFFF" stroke="#BCC6D6" stroke-width="1"/><rect x="98" y="466" width="108" height="108" rx="8" fill="#3D4FD7" opacity=".12"/><polygon points="115,552 142,484 192,530 162,572" fill="#3D4FD7" opacity=".45"/><text x="224" y="496" class="body" font-weight="750">Synthetic Song: Glass Meridian</text><text x="224" y="526" class="small" fill="#4C566A">Song • 4 charts</text><text x="224" y="556" class="small" fill="#246B47" font-weight="700">Reviewed • source attached</text><line x1="98" y1="596" x2="438" y2="596" stroke="#BCC6D6" stroke-width="1"/><text x="98" y="629" class="body" fill="#3D4FD7" font-weight="700">Open detail →</text><rect x="492" y="448" width="376" height="210" rx="10" fill="#FFFFFF" stroke="#BCC6D6" stroke-width="1"