name: Bug report
description: Report reproducible incorrect behavior in Arcaea-Viewer.
title: "[Bug] "
labels: ["type:bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Arcaea-Viewer is currently building a static, source-aware fan-wiki MVP while preserving a separate Rust/WASM prototype for later evaluation.

        Do not post secrets, private account data, proprietary chart or audio files, unlicensed assets, or sensitive security/licensing evidence in a public issue.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find an equivalent report.
          required: true
        - label: This report contains no secrets, private data, proprietary game files, or unlicensed media.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select the closest project surface.
      options:
        - Public wiki UI or navigation
        - Static catalog, content, or provenance
        - Accessibility, responsive behavior, or performance
        - Rust/WASM parser, timing, or renderer prototype
        - Build, CI, release, or repository tooling
        - Roadmap automation or managed GitHub issues
        - Documentation or contributor workflow
        - Not sure
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact, frequency, and scope
      description: Explain who or what is affected, whether the task is blocked or degraded, how often it occurs, whether it is a regression, and any known workaround.
      placeholder: |
        - Impacted user/task:
        - Frequency: always / intermittent / once
        - Scope: one route/record/environment or broader
        - Regression: yes/no/unknown; last known good version
        - Workaround:
    validations:
      required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Actual behavior
      description: Describe exactly what happened, including visible errors or incorrect data.
      placeholder: What did you observe?
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe the correct result and why it is expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest deterministic sequence that reproduces the problem. Include a minimal fixture or payload when safe and relevant.
      placeholder: |
        1. Start from commit/version ...
        2. Open route or run command ...
        3. Use input or fixture ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Use N/A where a field does not apply.
      value: |
        - Commit, branch, app version, or deployment URL:
        - OS and version:
        - Browser and version:
        - Device or viewport:
        - Node, pnpm, Rust, or wasm-pack version:
        - Relevant feature flags, cache, or offline state:
      render: markdown
    validations:
      required: true

  - type: textarea
    id: source-evidence
    attributes:
      label: Source or correctness evidence
      description: For factual/content bugs, provide the official or reviewable source. For code bugs, provide the relevant fixture, test, specification, or invariant. Use N/A with a reason when not applicable.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs, metrics, or traces
      description: Paste only the minimal relevant output after removing tokens, local paths, account identifiers, and private information. Use N/A when no diagnostic output exists.
      render: shell
    validations:
      required: false

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Upload sanitized evidence only when it contains no private, proprietary, or unlicensed material.
    validations:
      required: false

  - type: textarea
    id: investigation
    attributes:
      label: Investigation notes
      description: Optional. Include suspected cause, affected files/contracts, attempted fixes, bisect result, or a proposed failing regression test.
    validations:
      required: false
