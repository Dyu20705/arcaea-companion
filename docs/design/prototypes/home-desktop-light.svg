<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Home desktop light prototype</title>
<desc id="desc">Synthetic Arcaea-Viewer Web MVP home page showing search, catalog freshness, reviewed highlights, categories, and missing media.</desc>
