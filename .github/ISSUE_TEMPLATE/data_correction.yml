name: Data or content correction
description: Propose a source-backed correction to catalog facts, provenance, version labels, links, or original wiki content.
title: "[Data correction] "
labels: ["type:docs", "area:data", "area:content", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for factual or editorial corrections. Do not paste proprietary chart/audio files, copied third-party prose, private evidence, or unlicensed media.

        A community wiki or search result may help identify a discrepancy, but publication decisions require reviewable source evidence and the repository's provenance policy.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find the same correction.
          required: true
        - label: This report contains no secrets, private data, proprietary game files, copied prose, or unlicensed media.
          required: true

  - type: dropdown
    id: entity-type
    attributes:
      label: Affected entity or content type
      options:
        - Song or chart metadata
        - Pack or release metadata
        - Partner or character metadata
        - Story chronology or summary
        - Game topic or mechanic
        - Source or provenance record
        - Asset permission, attribution, or alt-text record
        - Link, route, or editorial text
        - Other
    validations:
      required: true

  - type: input
    id: entity-id
    attributes:
      label: Entity ID, route, or file
      description: Provide the stable ID, public route, or repository path when known.
      placeholder: songs/example-id, /songs/example-id, or data/...
    validations:
      required: true

  - type: textarea
    id: current-value
    attributes:
      label: Current published value or behavior
      description: Quote only the minimum necessary text or value and identify where it appears.
    validations:
      required: true

  - type: textarea
    id: proposed-value
    attributes:
      label: Proposed correction
      description: State the corrected fact, wording, relation, version applicability, or permission status.
    validations:
      required: true

  - type: textarea
    id: source-evidence
    attributes:
      label: Source evidence
      description: Link authoritative or reviewable sources and explain what each source proves. Include game/app version and access date where relevant.
      placeholder: |
        - Source URL:
          - Supports:
          - Version/date:
    validations:
      required: true

  - type: textarea
    id: version-impact
    attributes:
      label: Version and relationship impact
      description: Identify affected game versions, aliases, reverse links, indexes, assets, or related records. Use N/A with a reason when none apply.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Suggested validation
      description: Describe validators, routes, snapshots, or manual checks that should prove the correction is complete.
      placeholder: Catalog validation, link check, affected page review, source audit...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Optional uncertainty, competing sources, screenshots, or correction history. Redact private information.
    validations:
      required: false
