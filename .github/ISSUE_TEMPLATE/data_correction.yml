name: Data or content correction
description: Propose a source-backed correction to facts, provenance, labels, links, or original Wiki content.
title: "[Data correction] "
labels: ["type:docs", "area:data", "area:content", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for factual or editorial corrections. Do not paste proprietary chart/audio files, copied third-party prose, private evidence, or unlicensed media.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find the same correction.
          required: true
        - label: This report contains no secrets, private data, proprietary game files, copied prose, or unlicensed media.
          required: true

  - type: dropdown
    id: entity-type
    attributes:
      label: Affected entity or content type
      options:
        - Song, chart, pack, or release metadata
        - Story chronology or summary
        - World, course, achievement, network, or game mechanic
        - Source or provenance record
        - Link, route, or editorial text
        - Other
    validations:
      required: true

  - type: input
    id: entity-id
    attributes:
      label: Entity ID, route, or file
      placeholder: sample-song-001, /wiki/music/..., or data/...
    validations:
      required: true

  - type: textarea
    id: current-value
    attributes:
      label: Current value or behavior
      description: Quote only the minimum necessary text or value and identify where it appears.
    validations:
      required: true

  - type: textarea
    id: proposed-value
    attributes:
      label: Proposed correction
      description: State the corrected fact, wording, relationship, version applicability, or permission status.
    validations:
      required: true

  - type: textarea
    id: source-evidence
    attributes:
      label: Source evidence
      description: Link authoritative or reviewable sources and explain what each source proves.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Related records and validation
      description: Identify affected aliases, reverse links, indexes, routes, assets, and checks needed to prove the correction is complete.
    validations:
      required: true
