name: Normalize Week 3 scope patch

on:
  push:
    branches:
      - fix/week-3-public-pages-scope
    paths:
      - .github/workflows/agent-week3-scope-fix.yml

permissions:
  contents: write

jobs:
  normalize-focused-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: fix/week-3-public-pages-scope
          fetch-depth: 0

      - name: Restore formatting and apply narrow semantic edits
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout 408176b6c9f2389f8c25087f6b18dfb25c6c1fe1 -- \
            roadmap/issues/week-3.json \
            roadmap/issue-execution-guidance.json

          python - <<'PY'
          from pathlib import Path

          manifest_path = Path("roadmap/issues/week-3.json")
          manifest = manifest_path.read_text(encoding="utf-8")
          replacements = {
              '"title": "[Epic · Weeks 3–4] Public wiki pages and related-entity product flow"':
                  '"title": "[Epic · Week 3] Core public wiki pages and related-entity flow"',
              '"outcome": "Deliver a coherent player-facing wiki flow across the homepage, catalog, songs, packs, partners, story, and game topics."':
                  '"outcome": "Deliver a coherent Week 3 player-facing flow across the homepage, explore catalog, songs, and packs while defining reusable contracts for later encyclopedia pages."',
              '"scope": ["Own shared page templates and related-entity navigation.", "Keep content sourced from the validated static catalog.", "Require accessibility, responsive, and image states on every page."],':
                  '"scope": ["Own shared page templates and related navigation for the homepage, explore, song, and pack surfaces.", "Define extension seams for Week 4 encyclopedia pages without delivering partner, story, or game-topic routes in this gate.", "Keep content sourced from the validated static catalog.", "Require accessibility, responsive, and image states on every Week 3 page."],\n      "nonGoals": ["Deliver partner, story, or game-topic pages; those outcomes remain under the Week 4 epic."],',
              '"acceptanceCriteria": ["Home → explore → entity detail flow works.", "Every page shows provenance/review status where appropriate.", "Missing optional data degrades gracefully.", "No page depends on chart runtime."],':
                  '"acceptanceCriteria": ["Home → explore → song or pack detail flow works.", "Week 3 pages show provenance/review status where appropriate.", "Missing optional data degrades gracefully.", "Shared contracts can support Week 4 pages without making them part of this epic\'s completion gate.", "No page depends on chart runtime."],',
          }
          for old, new in replacements.items():
              count = manifest.count(old)
              if count != 1:
                  raise SystemExit(f"manifest replacement matched {count} times: {old}")
              manifest = manifest.replace(old, new)
          manifest_path.write_text(manifest, encoding="utf-8")

          guidance_path = Path("roadmap/issue-execution-guidance.json")
          guidance = guidance_path.read_text(encoding="utf-8")
          guidance_replacements = {
              '"researchTasks": ["Map shared player questions and related-entity relationships across songs, packs, partners, story, and game topics."],':
                  '"researchTasks": ["Map shared player questions and related-entity relationships for the Week 3 homepage, explore, song, and pack flow; document extension needs for Week 4 without absorbing its delivery scope."],',
              '"implementationSteps": ["Define reusable page shells, provenance blocks, related-link patterns, media states, and domain view-model contracts before implementing every route separately."],':
                  '"implementationSteps": ["Define reusable Week 3 page shells, provenance blocks, song/pack related-link patterns, media states, and domain view-model contracts; expose explicit extension seams for later encyclopedia pages instead of implementing them here."],',
              '"uiUxTasks": ["Prevent dead ends, preserve back/share context, and keep dense facts readable without copying conventional wiki clutter."],':
                  '"uiUxTasks": ["Prevent dead ends across home, explore, song, and pack journeys, preserve back/share context, and keep dense facts readable without copying conventional wiki clutter."],',
              '"dataBackendTasks": ["Require all public page data to come from validated static records/indexes and expose unknown/version state explicitly."],':
                  '"dataBackendTasks": ["Require all Week 3 public-page data to come from validated static records/indexes, expose unknown/version state explicitly, and keep Week 4 entity data behind the later phase boundary."],',
              '"validationSteps": ["Test home → explore → detail → related entity loops and representative missing-data paths."],':
                  '"validationSteps": ["Test home → explore → song/pack detail → related song/pack loops, representative missing-data paths, and the absence of partner/story/game-topic delivery requirements from the Week 3 gate."],',
              '"deliverables": ["Shared page-template contracts, relation map, state matrix, and cross-route acceptance evidence."]':
                  '"deliverables": ["Week 3 shared page-template contracts, song/pack relation map, state matrix, cross-route acceptance evidence, and documented extension seams for Week 4."],\n      "risksAndRollback": ["Reject scope expansion that makes Week 3 depend on partner, story, or game-topic delivery; revert the focused manifest/guidance change if reconciliation produces any unrelated issue update."]',
          }
          for old, new in guidance_replacements.items():
              count = guidance.count(old)
              if count != 1:
                  raise SystemExit(f"guidance replacement matched {count} times: {old}")
              guidance = guidance.replace(old, new)
          guidance_path.write_text(guidance, encoding="utf-8")
          PY

          jq -e '.issues[] | select(.key == "public-pages-epic") | .title == "[Epic · Week 3] Core public wiki pages and related-entity flow" and .phase == "week-3" and .milestone == "week-3" and .parent == "week-3-epic" and (.nonGoals | length == 1)' roadmap/issues/week-3.json >/dev/null
          jq -e '.issues[] | select(.key == "public-pages-epic") | (.researchTasks[0] | contains("Week 3")) and (.researchTasks[0] | contains("Week 4")) and (.risksAndRollback | length == 1)' roadmap/issue-execution-guidance.json >/dev/null
          git diff --check

          changed_lines="$(git diff --numstat 408176b6c9f2389f8c25087f6b18dfb25c6c1fe1 -- roadmap/issues/week-3.json roadmap/issue-execution-guidance.json | awk '{a+=$1; d+=$2} END {print a+d}')"
          test "$changed_lines" -le 30 || {
            echo "Focused patch unexpectedly changes $changed_lines lines" >&2
            exit 1
          }

      - name: Commit normalized focused diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roadmap/issues/week-3.json roadmap/issue-execution-guidance.json
          git diff --cached --check
          git commit -m "fix(roadmap): keep public pages epic within Week 3"
          git push origin HEAD:fix/week-3-public-pages-scope
