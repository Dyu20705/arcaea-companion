name: Bug report
description: Report reproducible incorrect behavior in Arcaea Companion.
title: "[Bug] "
labels: ["type:bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the smallest reproducible problem in Arcaea Companion.

        Do not post secrets, private account data, proprietary chart or audio files, unlicensed assets, or sensitive security/licensing evidence.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find an equivalent report.
          required: true
        - label: This report contains no secrets, private data, proprietary game files, or unlicensed media.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Application shell or navigation
        - Home, Wiki, Tools, or About route
        - Data, content, or provenance
        - Accessibility or responsive behavior
        - Build, CI, or repository tooling
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior and impact
      description: Explain what happened, who or what is affected, frequency, scope, and any workaround.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe the correct result and why it is expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      placeholder: |
        1. Start from commit/version ...
        2. Open route or run command ...
        3. Perform ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Commit, branch, app version, or deployment URL:
        - OS and version:
        - Browser and version:
        - Device or viewport:
        - Node and pnpm versions, when relevant:
      render: markdown
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add sanitized logs, screenshots, fixtures, sources, or test output that demonstrate the problem.
    validations:
      required: false
