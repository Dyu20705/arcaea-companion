ight="92" rx="8" fill="#E9EEF7" stroke="#BCC6D6" stroke-width="1"/><text x="408" y="778" class="body" font-weight="750">Packs</text><text x="408" y="808" class="small" fill="#4C566A">Browse relationships</text><rect x="700" y="744" width="286" height="92" rx="8" fill="#E9EEF7" stroke="#BCC6D6" stroke-width="1"/><text x="718" y="778" class="body" font-weight="750">Partners</text><text x="718" y="808" class="small" fill="#4C566A">Facts with spoiler states</text><rect x="1010" y="744" width="286" height="92" rx="8" fill="#E9EEF7" stroke="#BCC6D6" stroke-width="1"/><text x="1028" y="778" class="body" font-weight="750">Game topics</text><text x="1028" y="808" class="small" fill="#4C566A">Version-aware guides</text><text x="80" y="875" class="small" fill="#4C566A">Unofficial • No accounts • No analytics • Legal and correction path in /legal</text></svg>
