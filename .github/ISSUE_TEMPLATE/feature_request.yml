name: Product or feature proposal
description: Propose an evidence-backed improvement for Arcaea Companion.
title: "[Proposal] "
labels: ["type:feature", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before prescribing an implementation. Current work prioritizes the accessible companion shell and structured Wiki experience.

        Do not propose publishing proprietary game files, copied third-party prose, secrets, private data, or unlicensed media.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find an equivalent proposal.
          required: true
        - label: The proposal respects project data, privacy, licensing, and publication boundaries.
          required: true

  - type: textarea
    id: user-problem
    attributes:
      label: User problem
      description: Who is affected, what are they trying to accomplish, and what currently blocks or slows them?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the smallest useful, observable result without assuming a specific architecture.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: State included behavior, explicit exclusions, dependencies, and work that can be deferred.
    validations:
      required: true

  - type: textarea
    id: quality
    attributes:
      label: UX and quality requirements
      description: Cover relevant responsive, keyboard, zoom, reduced-motion, loading, empty, error, security, privacy, and rollback behavior.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Add official sources, user feedback, measurements, prototypes, or comparable products.
    validations:
      required: false
