name: Apply PR 92 review fixes

on:
  push:
    branches:
      - docs/wiki-benchmark-post-mvp-strategy
    paths:
      - .github/workflows/agent-pr92-review-fixes.yml

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: docs/wiki-benchmark-post-mvp-strategy
          fetch-depth: 0

      - name: Sync main and apply editorial fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          readme = Path("README.md")
          replace_once(
              readme,
              "The longer-term direction is a broader fanmade player companion that can help players find inspiration, decide what to play, improve deliberately, and return to Arcaea through useful, explainable experiences. That direction is explicitly post-MVP and must not expand the current wiki release gate.",
              "A possible longer-term direction is a broader fan-made player companion that can help players find inspiration, decide what to play, improve deliberately, and return to Arcaea through useful, explainable experiences. This proposal is explicitly post-MVP and must not expand the current wiki release gate.",
          )
          replace_once(
              readme,
              "- [Wiki benchmark and product guardrails](docs/product/WIKI_BENCHMARK_AND_PRODUCT_GUARDRAILS.md)\n- [Six-week Web MVP roadmap](docs/roadmap/WEB_MVP_ROADMAP.md)",
              "- [Wiki benchmark and product guardrails](docs/product/WIKI_BENCHMARK_AND_PRODUCT_GUARDRAILS.md)\n- [Proposed player-companion post-MVP backlog](docs/product/PLAYER_COMPANION_POST_MVP_BACKLOG.md)\n- [Six-week Web MVP roadmap](docs/roadmap/WEB_MVP_ROADMAP.md)",
          )
          replace_once(
              readme,
              "After the wiki release, post-MVP work is separated into content scale/localization, player-companion, runtime/analysis, and optional platform-service programs. Each program requires measured user value and explicit legal, privacy, accessibility, security, performance, operations, and maintenance decisions.",
              "The proposed post-MVP taxonomy separates content scale/localization, player-companion, runtime/analysis, and optional platform-service programs. It is planning guidance, not active managed scope; each program requires measured user value, explicit legal/privacy/maintenance decisions, and a focused roadmap change before activation.",
          )

          benchmark = Path("docs/product/WIKI_BENCHMARK_AND_PRODUCT_GUARDRAILS.md")
          replace_once(
              benchmark,
              "The reviewed references are:\n\n- [Arcaea Wiki on Fandom](https://arcaea.fandom.com/wiki/Arcaea_Wiki)\n- [Wikipedia: Arcaea](https://en.wikipedia.org/wiki/Arcaea)\n- [Arcaea Fan Wiki on Miraheze](https://arcaea.miraheze.org/wiki/Arcaea_Fan_Wiki)\n- [Japanese Arcaea Wiki on WikiWiki](https://wikiwiki.jp/arcaea/)\n\nResearch findings are observations of public product behavior at the snapshot date. Facts intended for publication in Arcaea-Viewer still require the source hierarchy and approval process owned by the legal/provenance work.",
              "Representative evidence reviewed:\n\n- [Arcaea Wiki home on Fandom](https://arcaea.fandom.com/wiki/Arcaea_Wiki)\n- [Fandom Basic Guide](https://arcaea.fandom.com/wiki/Basic_Guide)\n- [Wikipedia: Arcaea](https://en.wikipedia.org/wiki/Arcaea)\n- [Miraheze song-page example: Purgatorium](https://arcaea.miraheze.org/wiki/Purgatorium)\n- [Japanese Arcaea Wiki on WikiWiki](https://wikiwiki.jp/arcaea/)\n\nThis was a qualitative product review, not an exhaustive content, licensing, accessibility, or usability audit. Public pages and community conclusions can change after the snapshot date. These references support observations about user tasks and presentation patterns only; facts intended for publication in Arcaea-Viewer still require the source hierarchy, independent verification, and approval process owned by the legal/provenance work.",
          )
          replace_once(
              benchmark,
              "After the wiki is stable, Arcaea-Viewer may become a broader fanmade player companion that helps players:",
              "After the wiki is stable, Arcaea-Viewer may become a broader fan-made player companion that helps players:",
          )
          old_companion_section = """## 6. Post-MVP player companion program

The player-companion direction is intentionally deferred until the wiki public preview is stable. It should be evaluated as a separate product program, not appended casually to entity pages.

### Candidate value loop

```text
Choose an intent or question
        ↓
Receive an explainable discovery or practice suggestion
        ↓
Play in Arcaea
        ↓
Record an optional local reflection
        ↓
Adapt the next suggestion without punitive pressure
```

### Candidate capabilities

- daily or situational song discovery;
- short-session planning;
- explainable practice ladders and bridge songs;
- skill taxonomy and chart-demand profiles;
- local-first goals, notes, and reflections;
- confidence-aware community observations;
- device-specific latency knowledge;
- Potential and chart-constant research with method and uncertainty;
- official outbound listening and source links;
- lore and relationship graph exploration.

### Required principles

- no account or upload by default;
- local-first storage, export, deletion, and recovery;
- no scraping of player accounts or protected services;
- no unexplainable recommendation score;
- no punitive streaks, shame, forced urgency, or fabricated scarcity;
- no subjective recommendation presented as official truth;
- no chart/runtime dependency until legal inputs and user value are approved;
- preserve a fully usable wiki when post-MVP services or personal data are unavailable.

### Entry criteria

The program may begin only when:

1. Web MVP 0.1 has passed the release gate;
2. catalog freshness and maintenance cost have been measured;
3. player research identifies a concrete problem beyond lookup;
4. legal inputs and prohibited data paths are documented;
5. privacy and deletion behavior are approved;
6. the smallest useful vertical slice is sustainable for one maintainer;
7. success can be measured without invasive tracking.
"""
          new_companion_section = """## 6. Post-MVP player companion program

The player-companion direction is intentionally deferred until the wiki public preview is stable. It should be evaluated as a separate product program, not appended casually to entity pages.

The canonical proposal—including the candidate value loop, work packages, entry criteria, privacy/governance rules, and activation procedure—is maintained in [Player Companion Post-MVP Backlog](PLAYER_COMPANION_POST_MVP_BACKLOG.md). This benchmark adds only the cross-cutting constraints:

- verified catalog facts and subjective/community observations remain separate;
- no account, upload, protected-service scraping, or opaque recommendation is required by default;
- personal state is local-first, inspectable, exportable, and removable when introduced;
- the static public wiki remains fully usable when every companion capability is disabled or unavailable;
- no work package becomes active until a focused canonical roadmap change is approved.
"""
          replace_once(benchmark, old_companion_section, new_companion_section)
          replace_once(
              benchmark,
              "- #55 remains the parent expansion gate.\n- New player-companion issues define strategy, explainable discovery/practice, local-first progress, and community knowledge separately from runtime/backend expansion.",
              "- #55 is the current managed post-MVP coordination gate, but its canonical title, outcome, scope, and execution guidance do not yet authorize player-companion children.\n- Before activation, a focused roadmap PR must either update #55's canonical manifest and guidance or select another approved managed parent, then create complete player-companion issues separately from runtime/backend expansion.",
          )

          brief = Path("docs/product/WEB_MVP_BRIEF.md")
          old_brief_tail = """## Post-MVP player companion direction

After the wiki MVP is stable, the project may develop into a local-first player companion that helps players gain inspiration, decide what to play, improve deliberately, and return to Arcaea through useful experiences.

This direction should be evaluated as a separate product program with the following potential loop:

```text
Choose an intent or question
        ↓
Receive an explainable discovery or practice suggestion
        ↓
Play in Arcaea
        ↓
Record an optional local reflection
        ↓
Adapt the next suggestion without punitive pressure
```

Candidate capabilities include daily discovery, short-session planning, practice ladders, skill-demand profiles, local goals/reflections, confidence-aware community knowledge, device latency reports, Potential research, and richer lore/entity graphs.

The program must remain:

- local-first by default;
- explainable rather than black-box;
- optional and fully separable from the public wiki;
- free of punitive streaks, shame, forced urgency, or fabricated scarcity;
- honest about subjective claims and confidence;
- independent of scraping player accounts or protected services;
- gated by product research, legal review, privacy/deletion behavior, maintenance capacity, and a small sustainable vertical slice.

## Post-MVP sequence

After the wiki MVP is stable, the project can grow in this order:

1. measure wiki usage, catalog freshness, update burden, correction patterns, and player needs without invasive tracking;
2. broaden versioned community-maintained content where maintenance capacity supports it;
3. improve search, cross-linking, history, and localization;
4. approve the player-companion strategy and its legal/privacy boundaries;
5. prototype explainable discovery or practice support using the trusted catalog;
6. add local-first goals, notes, reflection, export, deletion, and recovery only when they create measured value;
7. evaluate community knowledge such as subjective difficulty, latency, and Potential research with explicit method and confidence;
8. reconnect chart viewer and deterministic analytics surfaces only through legal inputs and isolated contracts;
9. add optional hosted data/search services only when static delivery is proven insufficient;
10. consider replay or personal analysis only after a separate privacy and supported-input decision.

Each expansion must pass a separate product, legal, privacy, performance, accessibility, security, operations, and maintenance decision."""
          new_brief_tail = """## Post-MVP direction

After the wiki MVP is stable, the project may evaluate content scale/localization, a local-first player companion, runtime/analysis, and optional platform services as separate programs.

The canonical player-companion proposal is [Player Companion Post-MVP Backlog](PLAYER_COMPANION_POST_MVP_BACKLOG.md). It owns the candidate value loop, work packages, entry criteria, privacy/governance constraints, and activation procedure; this brief intentionally does not duplicate them.

Before any post-MVP program becomes active:

1. measure user value, catalog freshness, update burden, correction patterns, and maintenance cost without invasive tracking;
2. select one sustainable vertical slice or make an explicit no-go decision;
3. approve product, legal, privacy, accessibility, security, performance, moderation, operations, and maintenance boundaries;
4. update the canonical roadmap manifest and execution guidance through a focused PR;
5. preserve a fully usable static wiki fallback.

No player-companion work is active under #55 until that canonical parent scope is explicitly updated or another managed parent is approved."""
          replace_once(brief, old_brief_tail, new_brief_tail)

          backlog = Path("docs/product/PLAYER_COMPANION_POST_MVP_BACKLOG.md")
          replace_once(
              backlog,
              "| Parent decision | #55 — Post-MVP expansion epic |\n| Activation gate | Web MVP 0.1 public-preview completion plus explicit maintainer approval |",
              "| Provisional coordination gate | #55 — current managed post-MVP epic; player-companion parentage is not yet approved |\n| Activation gate | Web MVP 0.1 public-preview completion, explicit maintainer approval, and a coordinated roadmap manifest/guidance change |",
          )
          replace_once(
              backlog,
              "The candidate work packages below should become roadmap-managed issues only after their entry criteria are met. At activation time, each issue must receive complete execution guidance, parent/dependency relationships, labels, acceptance criteria, tests, evidence requirements, and a pinned issue number after reconciliation.",
              "The candidate work packages below should become roadmap-managed issues only after their entry criteria are met. At activation time, each issue must receive complete execution guidance, parent/dependency relationships, labels, acceptance criteria, tests, evidence requirements, and a pinned issue number after reconciliation. If #55 is retained as the parent gate, its canonical title, outcome, scope, and execution guidance must first be updated through the same focused roadmap change.",
          )
          replace_once(
              backlog,
              "Before activating the implementation packages, create one roadmap-managed epic beneath #55 that owns:",
              "Before activating the implementation packages, approve the parent strategy. If #55 is retained, update its canonical manifest and execution guidance to include the player-companion program; otherwise select another approved managed parent. Then create one roadmap-managed companion epic that owns:",
          )
          replace_once(
              backlog,
              "When the program is approved:\n\n1. Convert the accepted work packages into `roadmap/issues/*.json` entries.\n2. Add exact execution guidance for every active issue before including the manifest.\n3. Run syntax, roadmap automation, existing-number, and stage-gate policy tests.\n4. Run a live read-only `--dry-run --force-update` plan.\n5. Confirm only intended post-MVP issue creations and relationships appear.\n6. Obtain explicit maintainer approval.\n7. Apply the roadmap change.\n8. Pin newly created issue numbers in `roadmap/issues.index.json` through a focused synchronization PR.",
              "When the program is approved:\n\n1. Approve the managed parent strategy and update #55's canonical scope/guidance first if it remains the parent gate.\n2. Convert the accepted work packages into `roadmap/issues/*.json` entries.\n3. Add exact execution guidance for every active issue before including the manifest.\n4. Run syntax, roadmap automation, existing-number, and stage-gate policy tests.\n5. Run a live read-only `--dry-run --force-update` plan.\n6. Confirm only intended post-MVP issue creations and relationships appear.\n7. Obtain explicit maintainer approval.\n8. Apply the roadmap change.\n9. Pin newly created issue numbers in `roadmap/issues.index.json` through a focused synchronization PR.",
          )

          roadmap = Path("docs/roadmap/WEB_MVP_ROADMAP.md")
          replace_once(
              roadmap,
              "- attractive post-MVP ideas are recorded as separate issues instead of silently expanding an active issue.",
              "- attractive post-MVP ideas remain in an inactive backlog and are promoted to managed issues only through a focused approved roadmap change.",
          )
          replace_once(
              roadmap,
              "## Beyond the MVP\n\nThe roadmap retains post-MVP work for four distinct programs:",
              "## Beyond the MVP\n\nThe four-program taxonomy below is documentation-level planning, not active managed scope. #55 currently governs runtime, analytics, replay, dataset, and platform expansion; activating player-companion children requires a focused canonical update to #55 or another approved managed parent.\n\nThe roadmap retains post-MVP work for four distinct programs:",
          )
          replace_once(
              roadmap,
              "The player-companion program should start with research and one small explainable vertical slice, not an account system or black-box recommendation engine. Candidate work includes daily discovery, short-session planning, practice ladders, skill-demand profiles, optional local reflection, device latency knowledge, Potential research, and richer relationship graphs.",
              "The player-companion proposal is maintained in [Player Companion Post-MVP Backlog](../product/PLAYER_COMPANION_POST_MVP_BACKLOG.md). It should start with research and one small explainable vertical slice, not an account system or black-box recommendation engine; this roadmap intentionally does not duplicate or activate its work packages.",
          )

          for path in (readme, benchmark, brief, backlog, roadmap):
              text = path.read_text(encoding="utf-8").rstrip() + "\n"
              path.write_text(text, encoding="utf-8")
          PY

          test "$(grep -R --line-number --fixed-strings 'fanmade' README.md docs/product docs/roadmap || true)" = ""
          test "$(grep -R --fixed-strings 'Choose an intent or question' docs/product | wc -l)" -eq 1
          grep -Fq 'player-companion parentage is not yet approved' docs/product/PLAYER_COMPANION_POST_MVP_BACKLOG.md
          grep -Fq "canonical title, outcome, scope, and execution guidance do not yet authorize" docs/product/WIKI_BENCHMARK_AND_PRODUCT_GUARDRAILS.md
          grep -Fq 'intentionally does not duplicate them' docs/product/WEB_MVP_BRIEF.md
          git diff --check

          git add README.md docs/product/PLAYER_COMPANION_POST_MVP_BACKLOG.md docs/product/WEB_MVP_BRIEF.md docs/product/WIKI_BENCHMARK_AND_PRODUCT_GUARDRAILS.md docs/roadmap/WEB_MVP_ROADMAP.md
          git diff --cached --check
          git commit -m "docs(product): resolve review drift and canonicalize backlog"
          git push origin HEAD:docs/wiki-benchmark-post-mvp-strategy
